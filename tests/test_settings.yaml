---
ttt888:
  touch: false
  s3_bucket: lmbda
  app_function: tests.test_app.hello_world
  callbacks:
    settings: test_settings.callback
    post: test_settings.callback
    zip: test_settings.callback
  delete_local_zip: true
  debug: true
  parameter_depth: 2
  prebuild_script: test_settings.prebuild_me
  events:
  - function: tests.test_app.schedule_me
    expression: rate(1 minute)
  - function: test.test_app.method
    event_source:
      arn: arn:aws:sns:::1
      events:
      - sns:Publish
devor:
  s3_bucket: lmbda
  app_function: tests.test_app.hello_world
  callbacks:
    settings: tests.test_app.callback
    post: tests.test_app.callback
    zip: test_settings.callback
  delete_local_zip: true
  debug: true
  parameter_depth: 2
  prebuild_script: test_settings.prebuild_me
  events:
  - function: tests.test_app.schedule_me
    expression: rate(1 minute)
extendo:
  extends: ttt888
  touch: true
  prebuild_script: test_settings.prebuild_me
  environment_variables:
    EXTENDO: You bet
extendo2:
  extends: extendo
  s3_bucket: lmbda2
deprecated_remote_env:
  s3_bucket: lmbda
  remote_env_bucket: lmbda-env
  remote_env_file: dev/env.json
remote_env:
  s3_bucket: lmbda
  remote_env: s3://lmbda-env/prod/env.json
extendofail:
  extends: failfail
  prebuild_script: test_settings.prebuild_me
  environment_variables:
    EXTENDO: You bet
snap_start_enabled:
  extends: ttt888
  snap_start: PublishedVersions
snap_start_disabled:
  extends: ttt888
  snap_start: None
apigateway_lambda_qualifier_enabled:
  extends: ttt888
  apigateway_lambda_qualifier: live
snap_start_enabled_no_qualifier:
  extends: ttt888
  snap_start: PublishedVersions
snap_start_enabled_explicit_qualifier:
  extends: ttt888
  snap_start: PublishedVersions
  apigateway_lambda_qualifier: custom-alias
provisioned_concurrency_enabled_no_qualifier:
  extends: ttt888
  provisioned_concurrency: 5
provisioned_concurrency_enabled_explicit_qualifier:
  extends: ttt888
  provisioned_concurrency: 5
  apigateway_lambda_qualifier: custom-alias
provisioned_concurrency_and_snap_start_conflict:
  extends: ttt888
  provisioned_concurrency: 5
  snap_start: PublishedVersions
provisioned_concurrency_exceeds_reserved:
  extends: ttt888
  provisioned_concurrency: 10
  lambda_concurrency: 5
snap_start_enabled_num_retained_versions_too_low:
  extends: ttt888
  snap_start: PublishedVersions
  num_retained_versions: 1
provisioned_concurrency_enabled_num_retained_versions_too_low:
  extends: ttt888
  provisioned_concurrency: 5
  num_retained_versions: 1
snap_start_enabled_num_retained_versions_ok:
  extends: ttt888
  snap_start: PublishedVersions
  num_retained_versions: 2
num_retained_versions_one_without_managed_alias:
  extends: ttt888
  num_retained_versions: 1
release_commands_enabled:
  extends: ttt888
  snap_start: PublishedVersions
  release_commands:
    - migrate --noinput
    - collectstatic --noinput
  release_health_check: /health
release_commands_with_provisioned_concurrency:
  extends: ttt888
  provisioned_concurrency: 5
  release_commands:
    - migrate --noinput
release_commands_without_managed_alias:
  extends: ttt888
  release_commands:
    - migrate --noinput
release_commands_invalid_type:
  extends: ttt888
  snap_start: PublishedVersions
  release_commands: migrate --noinput
release_commands_invalid_entry:
  extends: ttt888
  snap_start: PublishedVersions
