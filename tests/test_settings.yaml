    - migrate --noinput
    - "  "
release_health_check_disabled:
  extends: ttt888
  snap_start: PublishedVersions
  release_health_check: false
release_health_check_dict:
  extends: ttt888
  snap_start: PublishedVersions
  release_health_check:
    path: /health
    retries: 1
    interval: 2
    delay: 3
release_health_check_string:
  extends: ttt888
  snap_start: PublishedVersions
  release_health_check: /health
release_health_check_partial_dict:
  extends: ttt888
  snap_start: PublishedVersions
  release_health_check:
    path: /health
    retries: 0
release_health_check_unknown_key:
  extends: ttt888
  snap_start: PublishedVersions
  release_health_check:
    path: /health
    retrys: 5
release_health_check_true_without_path:
  extends: ttt888
  snap_start: PublishedVersions
  release_health_check: true
release_health_check_missing_path:
  extends: ttt888
  snap_start: PublishedVersions
  release_health_check:
